name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: hon-log.exe
            icon: assets/img/favicon.ico
            add_data: 'assets;assets'
          - os: macos-latest
            artifact: hon-log-macos.zip
            icon: assets/img/icon.icns
            add_data: 'assets:assets'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Build Windows executable
        if: matrix.os == 'windows-latest'
        run: >
          uv run pyinstaller src/main.py
          --onefile
          --noconfirm
          --name hon-log
          --icon="${{ matrix.icon }}"
          --add-data "${{ matrix.add_data }}"
          --noconsole

      - name: Build macOS app bundle
        if: matrix.os == 'macos-latest'
        run: >
          uv run pyinstaller src/main.py
          --onedir
          --noconfirm
          --name hon-log
          --icon="${{ matrix.icon }}"
          --add-data "${{ matrix.add_data }}"
          --windowed
          --osx-bundle-identifier jp.pantsman.hon-log

      - name: Package macOS app
        if: matrix.os == 'macos-latest'
        run: >
          ditto -c -k --sequesterRsrc --keepParent
          dist/hon-log.app dist/hon-log-macos.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-latest
          path: dist/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-latest
          path: dist/mac

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/hon-log.exe
            dist/mac/hon-log-macos.zip
          body: |
            貸出履歴は [こちら](https://www.lib.kyutech.ac.jp/opac/user/loan-history) からダウンロードできます。
            九工大IDでのログインが必要です。

            ## ダウンロード
            - ### [Windows](https://github.com/pantsman-jp/hon-log/releases/download/${{ steps.version.outputs.VERSION }}/hon-log.exe)
            - ### [macOS](https://github.com/pantsman-jp/hon-log/releases/download/${{ steps.version.outputs.VERSION }}/hon-log-macos.zip)

            ---
            Copyright (c) 2026 @pantsman-jp
          token: ${{ secrets.GITHUB_TOKEN }}
